name: pos_mobile_app
description: Aplikasi Kasir (POS) Mobile Offline-First
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # Database Lokal (Drift & SQLite)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.20
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.20.3
  # Import Data & File Picker
  file_picker: ^8.0.0
  excel: ^4.0.0

  flutter_speed_dial: ^7.0.0
  shared_preferences: ^2.5.5
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation Tools
  build_runner: ^2.4.8

  # Drift Generator
  drift_dev: ^2.14.1

  # Riverpod Generator & Linter
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.2

flutter:
  uses-material-design: true
